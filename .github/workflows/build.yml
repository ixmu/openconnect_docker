name: Build & Push OpenConnect Image

on:
  workflow_dispatch: {}
  schedule:
    # 每周日 03:00 UTC 触发一次，约等于每 7 天构建一次
    # （cron 的 day-of-month 字段无法精确表达"每7天"，故采用固定星期几）
    - cron: '0 3 * * 0'

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/openconnect

jobs:
  # 1. 统一确定本次要构建的 OpenConnect 版本号，供后续两个架构的 job 共用
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: 获取 OpenConnect 最新版本号
        id: ver
        run: |
          VER=$(curl -fsSL "https://gitlab.com/api/v4/projects/openconnect%2Fopenconnect/repository/tags" \
                | jq -r '[.[].name | select(startswith("v"))] | sort_by(.) | .[-1]' \
                | sed 's/^v//')
          if [ -z "$VER" ] || [ "$VER" = "null" ]; then
            echo "警告：无法从 GitLab 获取版本号，回退为 latest（由 Dockerfile 内部自动探测）"
            VER="latest"
          fi
          echo "检测到 OpenConnect 版本: $VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

  # 2. 分别在原生 amd64 / arm64 runner 上构建，不使用 QEMU 模拟
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest        # GitHub 原生 x86_64 runner
          - arch: arm64
            runner: ubuntu-24.04-arm     # GitHub 原生 arm64 runner（公共仓库免费提供）
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 确认 runner 架构
        run: uname -m

      - name: 安装 podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: 登录 Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
            podman login docker.io -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: 原生构建镜像（${{ matrix.arch }}）
        run: |
          set -eux
          VER="${{ needs.prepare.outputs.version }}"
          # 不加 --platform，直接在原生架构 runner 上编译，避免 QEMU 交叉编译
          podman build \
            --build-arg OPENCONNECT_VERSION="${VER}" \
            -t "${IMAGE_NAME}:${VER}-${{ matrix.arch }}" \
            -f Dockerfile .

      - name: 推送单架构 tag
        run: |
          set -eux
          VER="${{ needs.prepare.outputs.version }}"
          podman push "${IMAGE_NAME}:${VER}-${{ matrix.arch }}" \
            "docker://${IMAGE_NAME}:${VER}-${{ matrix.arch }}"

  # 3. 合并两个原生架构镜像为一个多架构 manifest 并推送最终 tag
  manifest:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: 安装 podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: 登录 Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
            podman login docker.io -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: 创建并合并多架构 manifest
        run: |
          set -eux
          VER="${{ needs.prepare.outputs.version }}"
          TAG="${IMAGE_NAME}:${VER}"

          podman manifest rm "${TAG}" 2>/dev/null || true
          podman manifest create "${TAG}"
          podman manifest add "${TAG}" "docker://${IMAGE_NAME}:${VER}-amd64"
          podman manifest add "${TAG}" "docker://${IMAGE_NAME}:${VER}-arm64"

      - name: 推送版本号 tag（若版本未变则覆盖）
        run: |
          set -eux
          VER="${{ needs.prepare.outputs.version }}"
          podman manifest push --all "${IMAGE_NAME}:${VER}" "docker://${IMAGE_NAME}:${VER}"

      - name: 推送 latest tag（始终覆盖）
        run: |
          set -eux
          VER="${{ needs.prepare.outputs.version }}"
          podman manifest push --all "${IMAGE_NAME}:${VER}" "docker://${IMAGE_NAME}:latest"

      - name: 输出结果
        run: |
          echo "已推送多架构镜像: ${IMAGE_NAME}:${{ needs.prepare.outputs.version }} 和 ${IMAGE_NAME}:latest"
