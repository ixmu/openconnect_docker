name: Build & Push OpenConnect Image

on:
  workflow_dispatch: {}
  schedule:
    # 每周日 03:00 UTC 触发一次，约等于每 7 天构建一次
    # （cron 的 day-of-month 字段无法精确表达"每7天"，故采用固定星期几）
    - cron: '0 3 * * 0'

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/openconnect

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 获取 OpenConnect 最新版本号
        id: ver
        run: |
          VER=$(curl -fsSL "https://gitlab.com/api/v4/projects/openconnect%2Fopenconnect/repository/tags" \
                | jq -r '[.[].name | select(startswith("v"))] | sort_by(.) | .[-1]' \
                | sed 's/^v//')
          if [ -z "$VER" ] || [ "$VER" = "null" ]; then
            echo "警告：无法从 GitLab 获取版本号，本次将由 Dockerfile 内部自动探测最新版"
            VER="latest"
          fi
          echo "检测到 OpenConnect 版本: $VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: 安装 QEMU（用于 arm64 交叉构建）
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64

      - name: 安装 podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman jq

      - name: 登录 Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
            podman login docker.io -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: 构建多架构 manifest（amd64 + arm64）
        run: |
          set -eux
          VER="${{ steps.ver.outputs.version }}"
          TAG="${IMAGE_NAME}:${VER}"

          # 若已存在同名 manifest（本地缓存残留），先删除，保证每次都是干净构建
          podman manifest rm "${TAG}" 2>/dev/null || true
          podman manifest create "${TAG}"

          for ARCH in amd64 arm64; do
            echo "==> 构建 ${ARCH} 架构镜像"
            podman build \
              --platform "linux/${ARCH}" \
              --build-arg OPENCONNECT_VERSION="${VER}" \
              --manifest "${TAG}" \
              -f Dockerfile .
          done

      - name: 推送版本号 tag（若版本未变则覆盖）
        run: |
          set -eux
          VER="${{ steps.ver.outputs.version }}"
          podman manifest push --all "${IMAGE_NAME}:${VER}" "docker://${IMAGE_NAME}:${VER}"

      - name: 推送 latest tag（始终覆盖）
        run: |
          set -eux
          VER="${{ steps.ver.outputs.version }}"
          podman manifest push --all "${IMAGE_NAME}:${VER}" "docker://${IMAGE_NAME}:latest"

      - name: 输出结果
        run: |
          echo "已推送镜像: ${IMAGE_NAME}:${{ steps.ver.outputs.version }} 和 ${IMAGE_NAME}:latest"
